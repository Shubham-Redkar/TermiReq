name: CI

on:
  push:
    branches: [main, sid]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show platform backend
        run: python -c "from src.runner import describe_platform; print(describe_platform())"

      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  zero-dep-proof:
    name: zero third-party dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert requirements.txt declares no packages
        shell: bash
        run: |
          # Any non-comment, non-blank line in requirements.txt is a dependency
          # and violates the zero-dependency guarantee (see STDLIB.md).
          if grep -vE '^\s*(#.*)?$' requirements.txt; then
            echo "::error::requirements.txt lists third-party packages"
            exit 1
          fi
          echo "OK: no third-party dependencies declared"
      - name: Import all modules with only the stdlib present
        run: |
          python -c "import src.parser, src.screen, src.diff, src.runner, src.cli, src.config, src.accessibility, src.contracts; print('all modules import cleanly')"
